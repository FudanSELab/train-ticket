components:
  schemas:
    # --- Common DTO Schemas ---
    Response:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        data:
          nullable: true

    # --- Auth DTO Schemas ---
    AuthDto:
      $ref: 'auth/schemas.yaml#/components/schemas/AuthDto'
    BasicAuthDto:
      $ref: 'auth/schemas.yaml#/components/schemas/BasicAuthDto'
    TokenDto:
      $ref: 'auth/schemas.yaml#/components/schemas/TokenDto'

    # --- Config DTO Schema ---
    ConfigDto:
      $ref: 'config/schemas.yaml#/components/schemas/ConfigDto'

    # --- Order DTO Schema ---
    OrderSecurityDto:
      $ref: 'order/schemas.yaml#/components/schemas/OrderSecurityDto'

    # --- User DTO Schema ---
    UserDto:
      $ref: 'user/schemas.yaml#/components/schemas/UserDto'
