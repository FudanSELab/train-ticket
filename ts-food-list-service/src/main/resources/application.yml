server:
  port: 19999

spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDRS:nacos-0.nacos-headless.default.svc.cluster.local,nacos-1.nacos-headless.default.svc.cluster.local,nacos-2.nacos-headless.default.svc.cluster.local}
  application:
    name: ts-food-list-service
  datasource:
    url: jdbc:mysql://${FOOD_LIST_MYSQL_HOST:ts-food-list-mysql}:${FOOD_LIST_MYSQL_PORT:3306}/${FOOD_LIST_MYSQL_DATABASE:ts-food-list-mysql}?useSSL=false
    username: ${FOOD_LIST_MYSQL_USER:root}
    password: ${FOOD_LIST_MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL5Dialect

swagger:
  controllerPackage: trainFood.controller